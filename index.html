function rows(){const a=filt();$('#cnt').textContent=a.length+' biển';$('#tb').innerHTML=a.slice(0,300).map(p=>{const s=sp(p.bks);return`<tr><td><b>${e(fmt(p.bks))}</b></td><td>${e(tinhOf(p.bks))}</td><td>${s.s}</td><td>${nf(s.n)}</td><td>${e(money(p.gia))}</td>${l>=2?`<td>${e(money(p.giathu))}</td><td>${e(df(p))}</td><td>${e(p.daily)}</td><td>${e(p.nguon)}</td>`:''}${l>=3?`<td><button class="ghost" data-e="${P.indexOf(p)}">Sửa</button> <button class="ghost" data-x="${P.indexOf(p)}">Xóa</button></td>`:''}</tr>`}).join('')}
draw();
$('#cpy').onclick=async()=>{const f=$('#fm').value,t=filt().map(p=>{const s=sp(p.bks);return f=='goc'?p.bks:f=='lien'?s.t+s.s+s.n:[s.t,s.s,nf(s.n)].join('\t')}).join('\n');await cp(t);m('Đã copy '+filt().length+' biển.')};
if(l>=3){const n=x=>x.replace(/\D/g,''),tr=g=>/^\d+$/.test(g)?Math.round(g/1e6):'';
$('#sv').onclick=async()=>{const bks=$('#e1').value.trim().toUpperCase();if(!bks)return m('Nhập biển số.');const r=await api('save',{p:{bks,gia:n($('#e3').value),giathu:n($('#e4').value)},nguon:ed?ed.nguon:($('#e7').value.trim()||'Kho'),...(ed?{row:ed.row,col:ed.col,cg:ed.cg,ct:ed.ct}:{})});m(r.ok?'Đã lưu.':r.m);if(r.ok){ed=null;await load();pK()}};
$('#tb').onclick=async x=>{const i=x.target.dataset.e,j=x.target.dataset.x;if(i!=null){const p=P[i];ed=p;$('#e1').value=p.bks;$('#e3').value=tr(p.gia);$('#e4').value=tr(p.giathu);$('#e7').value=p.nguon;m('Đang sửa '+p.bks+'. Sửa xong bấm Lưu biển.')}
if(j!=null&&confirm('Xóa biển '+P[j].bks+'?')){const p=P[j],r=await api('del',{nguon:p.nguon,row:p.row,col:p.col});m(r.ok?'Đã xóa.':r.m);if(r.ok){await load();pK()}}}}}
async function pU(){$('#pane').innerHTML='<p class="meta">Đang tải...</p>';const r=await api('users');if(!r.ok){$('#pane').innerHTML='';return m(r.m)}
$('#pane').innerHTML=`<div class="row"><input id="n1" placeholder="Số điện thoại"><input id="n2" placeholder="Họ tên"><input id="n3" type="password" placeholder="Mật khẩu"><select id="n4"><option value="1">Cấp 1</option><option value="2">Cấp 2</option><option value="3">Cấp 3</option></select><button id="nc">Tạo tài khoản</button></div><div class="tw"><table><thead><tr><th>SĐT</th><th>Tên</th><th>Cấp</th><th>Trạng thái</th><th></th></tr></thead><tbody>${r.users.map(u=>`<tr><td>${e(u.phone)}</td><td>${e(u.name)}</td><td><select data-l="${e(u.phone)}" style="width:90px">${[1,2,3].map(n=>`<option${u.level==n?' selected':''}>${n}</option>`).join('')}</select></td><td>${u.status=='ok'?'Đã duyệt':'Chờ duyệt'}</td><td>${u.status!='ok'?`<button data-a="${e(u.phone)}">Duyệt</button> `:''}<button class="ghost" data-d="${e(u.phone)}">Xóa</button></td></tr>`).join('')}</tbody></table></div>`;
$('#nc').onclick=async()=>{const p=$('#n1').value.trim();if(!p||$('#n3').value.length<6)return m('Nhập SĐT và mật khẩu (từ 6 ký tự).');const x=await api('ucreate',{phone:p,name:$('#n2').value.trim(),h:sha256('bx|'+p+'|'+$('#n3').value),level:+$('#n4').value});m(x.ok?'Đã tạo.':x.m);if(x.ok)pU()};
const set=async(p,lv,st,del)=>{const x=await api('uset',{phone:p,level:lv,status:st,del});m(x.ok?'Đã cập nhật.':x.m);pU()};
$('#pane').onchange=x=>{const p=x.target.dataset.l;if(p)set(p,+x.target.value,'ok')};
$('#pane').onclick=x=>{const a=x.target.dataset.a,d=x.target.dataset.d;if(a){const u=r.users.find(z=>z.phone==a);set(a,u.level,'ok')}if(d&&confirm('Xóa tài khoản '+d+'?'))set(d,0,'',1)}}
function fit(f){return new Promise(r=>{const i=new Image();i.onload=()=>{const k=Math.min(1,1600/i.width),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.8))};i.src=URL.createObjectURL(f)})}
function pC(){const Lb={hot:'Hotline hiển thị',tel:'Số gọi (chữ số)',zalo:'Link Zalo',mail:'Email',addr:'Địa chỉ',hours:'Giờ làm việc'};
$('#pane').innerHTML=`<canvas class="pv" id="pv"></canvas><div class="actions"><button id="nb">Tạo nền mới</button>${PAL.map((p,i)=>`<button class="ghost" data-p="${i}">Bảng màu ${i+1}</button>`).join('')}<button class="ghost" id="rm">Bỏ ảnh tải lên</button></div><label for="up">Tải ảnh nền (hiện cho mọi khách)</label><input id="up" type="file" accept="image/*">${Object.keys(Lb).map(k=>`<label for="c_${k}">${Lb[k]}</label><input id="c_${k}" value="${e(C[k])}">`).join('')}<div class="actions"><button id="sc">Lưu giao diện & liên hệ</button></div>`;
const r=()=>{if(C.bg){$('#pv').style.background=`url("${C.bg}") center/cover`}else $('#pv').style.background='';paint($('#pv'))};r();
$('#nb').onclick=()=>{C.seed=Math.random()*1e9|0;C.bg='';r()};$('#rm').onclick=()=>{C.bg='';r()};
$('#pane').onclick=x=>{if(x.target.dataset.p!=null){C.pal=+x.target.dataset.p;C.bg='';r()}};
$('#up').onchange=async x=>{const f=x.target.files[0];if(!f)return;m('Đang tải ảnh lên...');const u=await uploadBg(await fit(f));if(u.ok){C.bg=u.url;r();m('Đã tải ảnh. Bấm Lưu để áp dụng.')}else m(u.m||'Tải ảnh thất bại.')};
$('#sc').onclick=async()=>{Object.keys(Lb).forEach(k=>C[k]=$('#c_'+k).value.trim());const x=await api('cfg',{cfg:C});m(x.ok?'Đã lưu.':x.m)}}
function route(){(location.hash.startsWith('#/admin')||/\/admin\/?$/.test(location.pathname))?admin():site()}
addEventListener('hashchange',route);load().then(route);
</script></body></html>
