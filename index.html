<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BIENSOSHOP – Biển số đẹp, giá rõ ràng</title>

<style>
:root{--bg:#0c1917;--ink:#11201d;--brass:#d6a94a;--bone:#efe7d3;--seal:#b7372b;--mute:#9fb3ac;--line:#ffffff1f}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--bone);font:16px/1.6 "Segoe UI",system-ui,sans-serif;padding-top:env(safe-area-inset-top)}
h1,h2,.brand{font-family:"Iowan Old Style",Palatino,Georgia,serif;font-weight:700}
a{color:inherit}.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
header{position:sticky;top:0;z-index:5;background:#0c1917e6;backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;justify-content:space-between;height:58px}
.brand{font-size:20px;color:var(--brass);text-decoration:none;letter-spacing:.5px}
nav a{margin-left:20px;text-decoration:none;color:var(--mute)}nav a:hover{color:var(--bone)}
.hero{position:relative;min-height:440px;display:flex;align-items:flex-end;overflow:hidden}
.hero canvas{position:absolute;inset:0;width:100%;height:100%}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,var(--bg) 3%,#0c191759 75%)}
.hero .wrap{position:relative;z-index:1;padding-top:90px;padding-bottom:44px;width:100%}
h1{font-size:clamp(32px,6vw,58px);line-height:1.1;max-width:14ch}
.sub{color:var(--mute);margin:12px 0 22px;max-width:46ch}
input,select,textarea,button{font:inherit}
input,select,textarea{width:100%;padding:11px 13px;border-radius:8px;border:1px solid #ffffff2b;background:#0a1412;color:var(--bone)}
button,.btn{padding:11px 18px;border-radius:8px;border:0;background:var(--brass);color:#1a1205;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block}
.ghost{background:transparent;color:var(--bone);border:1px solid #ffffff38}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.search{max-width:520px}
h2{font-size:28px;margin:44px 0 14px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.chips button{padding:7px 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.card{background:var(--ink);border:1px solid var(--line);border-radius:10px;padding:18px;cursor:pointer;text-align:left;color:inherit;width:100%}
.card:hover{border-color:var(--brass)}
.plate{display:inline-block;background:#f6f3ea;color:#161616;border:3px solid #161616;border-radius:8px;padding:5px 14px;font:800 24px/1.2 "Courier New",monospace;letter-spacing:2px}
.price{color:var(--brass);font-weight:700;font-size:19px;margin-top:12px}
.meta{color:var(--mute);font-size:14px}
.contact dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.contact dt{color:var(--brass);font-weight:700}.contact dd{margin:2px 0 0}
.contact .box{background:var(--ink);border:1px solid var(--line);border-radius:10px;padding:16px}
footer{margin-top:56px;padding:22px 0;border-top:1px solid var(--line);color:var(--mute);font-size:14px}
dialog{background:var(--ink);color:var(--bone);border:1px solid var(--brass);border-radius:12px;padding:24px;max-width:420px;width:92%}
dialog::backdrop{background:#000a}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.adm{padding-top:20px;padding-bottom:40px}.bar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.lst{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
label{display:block;font-size:14px;color:var(--mute);margin:10px 0 4px}
#msg{margin-top:14px;color:var(--brass)}
.login{max-width:360px;margin:12vh auto}
canvas.pv{width:100%;height:200px;border-radius:10px;border:1px solid var(--line)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><div id="app"></div>
<script>
const H='7c9b7afff57bc24cf0a2164d8ce3bef59eebf41b7cd623f5e703c39c6d20c1c4';
const D={sheet:'',script:'',seed:7,pal:0,bg:'',c:{hot:'0888.188.888',tel:'0888188888',zalo:'https://zalo.me/0985198198',mail:'biensodep186@gmail.com',addr:'Việt Nam',hours:'Thứ 2 - Chủ nhật: 8:00 - 22:00'}};
const SAMPLE=[{bks:'99B-745.68',tinh:'Bắc Ninh',gia:'79000000',menh:'Kim',ghichu:'Lộc phát'},{bks:'30K-888.88',tinh:'Hà Nội',gia:'',menh:'Kim',ghichu:'Ngũ quý 8'},{bks:'51H-686.86',tinh:'TP. Hồ Chí Minh',gia:'350000000',menh:'Thủy',ghichu:'Lộc phát kép'}];
const PAL=[['#0c1917','#1b4a41','214,169,74'],['#1c0f0e','#5a1a14','233,190,110'],['#0e1526','#233a63','200,215,240'],['#161208','#4a3a12','240,205,120']];
const $=s=>document.querySelector(s);
const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ls={g(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},s(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch{return false}}};
let S=Object.assign({},D,ls.g('bss_set',{}));S.c={...D.c,...S.c};
let P=[],F={q:'',m:''},tab='p';
const save=()=>ls.s('bss_set',S);
const money=g=>/^\d+$/.test(g)?(+g).toLocaleString('vi-VN')+' đ':(g||'Liên hệ');
async function hash(s){return sha256(s)}
function sha256(s){const K=[],H=[];let p=0,c=2;const r=(x,n)=>x>>>n|x<<32-n;
for(;p<64;c++){let ok=1;for(let i=2;i*i<=c;i++)if(c%i==0){ok=0;break}if(ok){if(p<8)H[p]=Math.pow(c,.5)%1*4294967296|0;K[p++]=Math.pow(c,1/3)%1*4294967296|0}}
const b=[...new TextEncoder().encode(s)],l=b.length*8;b.push(128);while(b.length%64!=56)b.push(0);for(let i=0;i<4;i++)b.push(0);for(let i=3;i>=0;i--)b.push(l>>>i*8&255);
let h=H.slice();
for(let o=0;o<b.length;o+=64){const w=[];for(let i=0;i<16;i++)w[i]=b[o+4*i]<<24|b[o+4*i+1]<<16|b[o+4*i+2]<<8|b[o+4*i+3];
for(let i=16;i<64;i++){const s0=r(w[i-15],7)^r(w[i-15],18)^w[i-15]>>>3,s1=r(w[i-2],17)^r(w[i-2],19)^w[i-2]>>>10;w[i]=w[i-16]+s0+w[i-7]+s1|0}
let[a,B,C,d,E,f,g,q]=h;
for(let i=0;i<64;i++){const S1=r(E,6)^r(E,11)^r(E,25),ch=E&f^~E&g,t1=q+S1+ch+K[i]+w[i]|0,S0=r(a,2)^r(a,13)^r(a,22),mj=a&B^a&C^B&C,t2=S0+mj|0;q=g;g=f;f=E;E=d+t1|0;d=C;C=B;B=a;a=t1+t2|0}
h=[h[0]+a|0,h[1]+B|0,h[2]+C|0,h[3]+d|0,h[4]+E|0,h[5]+f|0,h[6]+g|0,h[7]+q|0]}
return h.map(x=>(x>>>0).toString(16).padStart(8,'0')).join('')}
function csv(t){const r=[];let w=[],c='',q=0;for(let i=0;i<t.length;i++){const x=t[i];if(q){if(x=='"'){if(t[i+1]=='"'){c+='"';i++}else q=0}else c+=x}else if(x=='"')q=1;else if(x==','){w.push(c);c=''}else if(x=='\n'||x=='\r'){if(x=='\r'&&t[i+1]=='\n')i++;w.push(c);r.push(w);w=[];c=''}else c+=x}if(c||w.length){w.push(c);r.push(w)}return r}
async function load(){P=ls.g('bss_plates',SAMPLE);if(!S.sheet)return;try{const t=await(await fetch(S.sheet)).text();const[h,...rows]=csv(t),k=h.map(x=>x.trim().toLowerCase());const a=rows.filter(r=>(r[0]||'').trim()).map(r=>{const o={};k.forEach((n,i)=>o[n]=(r[i]||'').trim());return o});if(a.length)P=a}catch(x){}}
function paint(cv,bg=S.bg){const dpr=devicePixelRatio||1,cw=cv.clientWidth||1200,ch=cv.clientHeight||440,w=cv.width=Math.min(1600,cw*dpr)|0,h=cv.height=(ch*w/cw)|0,x=cv.getContext('2d'),p=PAL[S.pal%PAL.length];
if(bg){const i=new Image();i.onload=()=>{const k=Math.max(w/i.width,h/i.height);x.drawImage(i,(w-i.width*k)/2,(h-i.height*k)/2,i.width*k,i.height*k)};i.src=bg;return}
const g=x.createLinearGradient(0,0,w,h);g.addColorStop(0,p[0]);g.addColorStop(1,p[1]);x.fillStyle=g;x.fillRect(0,0,w,h);
let s=S.seed;const R=()=>(s=(s*1664525+1013904223)>>>0)/4294967296;
for(let n=0;n<3;n++){const cx=R()*w,cy=R()*h;for(let r=30;r<Math.max(w,h);r+=26+R()*14){x.beginPath();x.arc(cx,cy,r,0,7);x.strokeStyle=`rgba(${p[2]},${.05+R()*.14})`;x.lineWidth=1+R()*2;x.stroke()}}
for(let i=0;i<24;i++){x.fillStyle=`rgba(${p[2]},${R()*.08})`;x.fillRect(R()*w,0,2+R()*8,h)}}
function site(){const c=S.c;$('#app').innerHTML=`<header><div class="wrap"><a class="brand" href="#/">BIENSOSHOP</a><nav><a href="#kho">Kho biển</a><a href="#lienhe">Liên hệ</a></nav></div></header>
<section class="hero"><canvas id="cv"></canvas><div class="wrap"><h1>Biển số đẹp, giá rõ ràng</h1><p class="sub">Chọn biển theo mệnh, theo tỉnh, theo ngân sách. Gọi hoặc nhắn Zalo để được tư vấn thủ tục sang tên.</p><div class="search"><input id="q" placeholder="Nhập biển số, ví dụ 68 hoặc 999" aria-label="Tìm biển số"></div></div></section>
<main class="wrap" id="kho"><h2>Kho biển số</h2><div class="chips" id="chips"></div><div class="grid" id="grid"></div></main>
<section class="wrap contact" id="lienhe"><h2>Liên Hệ BIENSOSHOP</h2><p class="meta" style="margin-bottom:16px">Chúng tôi luôn sẵn sàng hỗ trợ bạn 24/7. Liên hệ với chúng tôi qua các kênh sau:</p>
<dl><div class="box"><dt>📞 Hotline</dt><dd><a href="tel:${e(c.tel)}">${e(c.hot)}</a></dd></div><div class="box"><dt>💬 Zalo</dt><dd><a href="${e(c.zalo)}" target="_blank" rel="noopener">Chat Zalo ngay</a></dd></div><div class="box"><dt>📧 Email</dt><dd><a href="mailto:${e(c.mail)}">${e(c.mail)}</a></dd></div><div class="box"><dt>📍 Địa chỉ</dt><dd>${e(c.addr)}</dd></div><div class="box"><dt>Giờ làm việc</dt><dd>${e(c.hours)}</dd></div></dl></section>
<footer><div class="wrap">© 2026 BIENSOSHOP</div></footer><dialog id="dlg"></dialog>`;
paint($('#cv'));$('#q').oninput=x=>{F.q=x.target.value;list()};list()}
function list(){const M=['Tất cả','Kim','Mộc','Thủy','Hỏa','Thổ'];$('#chips').innerHTML=M.map(m=>`<button class="${(F.m||'Tất cả')==m?'':'ghost'}" data-m="${m}">${m}</button>`).join('');
$('#chips').onclick=x=>{const m=x.target.dataset.m;if(m){F.m=m=='Tất cả'?'':m;list()}};
const q=F.q.toLowerCase().replace(/[^a-z0-9]/g,''),a=P.filter(p=>(!F.m||p.menh==F.m)&&(!q||(p.bks||'').toLowerCase().replace(/[^a-z0-9]/g,'').includes(q)));
$('#grid').innerHTML=a.length?a.map(p=>`<button class="card" data-b="${e(p.bks)}"><span class="plate">${e(p.bks)}</span><div class="price">${e(money(p.gia))}</div><div class="meta">${e(p.tinh)}${p.menh?' · Mệnh '+e(p.menh):''}</div></button>`).join(''):'<p class="meta">Chưa có biển phù hợp. Thử số khác hoặc gọi hotline để được tìm giúp.</p>';
$('#grid').onclick=x=>{const b=x.target.closest('[data-b]');if(!b)return;const p=P.find(z=>z.bks==b.dataset.b),c=S.c;$('#dlg').innerHTML=`<span class="plate">${e(p.bks)}</span><div class="price">${e(money(p.gia))}</div><p class="meta">${e(p.tinh)}${p.menh?' · Mệnh '+e(p.menh):''}</p><p>${e(p.ghichu)}</p><div class="actions"><a class="btn" href="tel:${e(c.tel)}">Gọi ${e(c.hot)}</a><a class="btn ghost" href="${e(c.zalo)}" target="_blank" rel="noopener">Chat Zalo</a><button class="ghost" onclick="dlg.close()">Đóng</button></div>`;$('#dlg').showModal()}}
/* ---------- ADMIN ---------- */
const m=t=>{const n=$('#msg');if(n)n.textContent=t};
function login(){$('#app').innerHTML=`<div class="login wrap"><h2>Đăng nhập quản trị</h2><label for="u">Tài khoản</label><input id="u" autocomplete="username"><label for="pw">Mật khẩu</label><input id="pw" type="password" autocomplete="current-password"><div class="actions"><button id="go">Đăng nhập</button><a class="btn ghost" href="#/">Về trang chủ</a></div><p id="msg"></p></div>`;
$('#go').onclick=async()=>{if(await hash('bss|'+$('#u').value.trim()+'|'+$('#pw').value)===H){sessionStorage.setItem('bss_ok','1');admin()}else m('Sai tài khoản hoặc mật khẩu.')};$('#pw').onkeydown=x=>x.key=='Enter'&&$('#go').click()}
function admin(){if(!sessionStorage.getItem('bss_ok'))return login();
$('#app').innerHTML=`<div class="wrap adm"><div class="bar"><h2 style="margin:0">Quản trị BIENSOSHOP</h2><div><a class="btn ghost" href="#/">Xem web</a> <button class="ghost" id="out">Đăng xuất</button></div></div><div class="tabs">${[['p','Biển số'],['s','Google Sheet'],['t','Giao diện'],['c','Liên hệ']].map(([k,n])=>`<button class="${k==tab?'':'ghost'}" data-t="${k}">${n}</button>`).join('')}</div><div id="pane"></div><p id="msg" role="status"></p></div>`;
$('#out').onclick=()=>{sessionStorage.removeItem('bss_ok');location.hash='#/'};
document.querySelector('.tabs').onclick=x=>{if(x.target.dataset.t){tab=x.target.dataset.t;admin()}};({p:pP,s:pS,t:pT,c:pC})[tab]()}
function pP(){const K=['Kim','Mộc','Thủy','Hỏa','Thổ'];$('#pane').innerHTML=`<div class="row"><input id="a1" placeholder="Biển số (99B-745.68)"><input id="a2" placeholder="Tỉnh"><input id="a3" placeholder="Giá (chỉ số)" inputmode="numeric"><select id="a4"><option value="">Mệnh</option>${K.map(k=>`<option>${k}</option>`).join('')}</select><input id="a5" placeholder="Ghi chú"><button id="add">Thêm biển</button></div>${P.map((p,i)=>`<div class="lst"><span><b>${e(p.bks)}</b> · ${e(p.tinh)} · ${e(money(p.gia))}</span><button class="ghost" data-d="${i}">Xóa</button></div>`).join('')||'<p class="meta">Chưa có biển nào.</p>'}`;
$('#add').onclick=async()=>{const o={bks:$('#a1').value.trim().toUpperCase(),tinh:$('#a2').value.trim(),gia:$('#a3').value.replace(/\D/g,''),menh:$('#a4').value,ghichu:$('#a5').value.trim()};if(!o.bks)return m('Nhập biển số trước khi thêm.');
if(S.script){try{await fetch(S.script,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action:'add',...o})});m('Đã gửi lên Google Sheet.')}catch{m('Không gửi được lên Google Sheet, kiểm tra lại link Apps Script.')}}else m('Đã thêm (lưu trên trình duyệt này). Nhập link Apps Script để ghi vào Google Sheet.');
P.unshift(o);ls.s('bss_plates',P);pP()};
$('#pane').onclick=async x=>{const i=x.target.dataset.d;if(i==null)return;const p=P.splice(+i,1)[0];ls.s('bss_plates',P);if(S.script)try{await fetch(S.script,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action:'delete',bks:p.bks})})}catch{}pP();m('Đã xóa '+p.bks)}}
function pS(){$('#pane').innerHTML=`<label for="s1">Link CSV của Google Sheet (Tệp → Chia sẻ → Xuất bản lên web → CSV)</label><input id="s1" value="${e(S.sheet)}"><label for="s2">Link Apps Script (để thêm/xóa biển từ trang admin)</label><input id="s2" value="${e(S.script)}"><p class="meta">Dòng đầu của sheet: bks, tinh, gia, menh, ghichu</p><div class="actions"><button id="sv">Lưu và tải lại dữ liệu</button></div>`;
$('#sv').onclick=async()=>{S.sheet=$('#s1').value.trim();S.script=$('#s2').value.trim();save();await load();m('Đã tải '+P.length+' biển.')}}
function fit(f){return new Promise(r=>{const i=new Image();i.onload=()=>{const k=Math.min(1,1600/i.width),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.8))};i.src=URL.createObjectURL(f)})}
function pT(){$('#pane').innerHTML=`<canvas class="pv" id="pv"></canvas><div class="actions"><button id="nb">Tạo nền mới</button>${PAL.map((p,i)=>`<button class="ghost" data-p="${i}">Bảng màu ${i+1}</button>`).join('')}<button class="ghost" id="rm">Bỏ ảnh đã tải</button></div><label for="up">Tải ảnh nền của bạn (JPG/PNG)</label><input id="up" type="file" accept="image/*">`;
const r=()=>paint($('#pv'));r();
$('#nb').onclick=()=>{S.seed=Math.random()*1e9|0;S.bg='';save();r()};
$('#pane').onclick=x=>{if(x.target.dataset.p!=null){S.pal=+x.target.dataset.p;S.bg='';save();r()}};
$('#rm').onclick=()=>{S.bg='';save();r()};
$('#up').onchange=async x=>{const f=x.target.files[0];if(!f)return;S.bg=await fit(f);if(!save()){S.bg='';return m('Ảnh quá lớn để lưu, hãy chọn ảnh nhỏ hơn.')}r();m('Đã đặt ảnh nền.')}}
function pC(){const L={hot:'Hotline hiển thị',tel:'Số gọi (chỉ chữ số)',zalo:'Link Zalo',mail:'Email',addr:'Địa chỉ',hours:'Giờ làm việc'};$('#pane').innerHTML=Object.keys(L).map(k=>`<label for="c_${k}">${L[k]}</label><input id="c_${k}" value="${e(S.c[k])}">`).join('')+'<div class="actions"><button id="sc">Lưu liên hệ</button></div>';
$('#sc').onclick=()=>{Object.keys(L).forEach(k=>S.c[k]=$('#c_'+k).value.trim());save();m('Đã lưu.')}}
function route(){(location.hash.startsWith('#/admin')||/\/admin\/?$/.test(location.pathname))?admin():site()}
addEventListener('hashchange',route);
load().then(route);
</script></body></html>
