<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kích hoạt key</title>
<style>
  :root { --bg:#eef1f5; --card:#fff; --ink:#1b2430; --mute:#5d6b7c; --line:#d5dbe3; --ok:#0f766e; --err:#b42318; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#12171e; --card:#1a212b; --ink:#e8edf3; --mute:#93a0b0; --line:#2b3542; --ok:#4fd1c5; --err:#ff8a80; }
  }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:20px;
         background:var(--bg); color:var(--ink); font:16px/1.5 "Segoe UI", system-ui, sans-serif; }
  main { width:100%; max-width:440px; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:28px; }
  h1 { margin:0 0 4px; font-size:22px; }
  p.sub { margin:0 0 22px; color:var(--mute); font-size:14px; }
  label { display:block; font-size:13px; color:var(--mute); margin:14px 0 6px; }
  input { width:100%; padding:11px 12px; font:inherit; color:var(--ink); background:transparent;
          border:1px solid var(--line); border-radius:8px; }
  input:focus-visible, button:focus-visible { outline:2px solid var(--ok); outline-offset:2px; }
  button { width:100%; margin-top:20px; padding:12px; font:inherit; font-weight:600; cursor:pointer;
           color:#fff; background:var(--ok); border:0; border-radius:8px; }
  @media (prefers-color-scheme: dark) { button { color:#0b1f1d; } }
  button:disabled { opacity:.6; cursor:wait; }
  #msg { margin-top:16px; min-height:24px; font-size:14px; }
  #msg.ok { color:var(--ok); } #msg.err { color:var(--err); }
  .dev { margin-top:22px; padding-top:16px; border-top:1px solid var(--line); font-size:12px; color:var(--mute); word-break:break-all; }
</style>
</head>
<body>
<main>
  <h1>Kích hoạt key</h1>
  <p class="sub">Nhập key bạn đã nhận để dùng gói theo tháng.</p>

  <label for="key">Key</label>
  <input id="key" autocomplete="off" spellcheck="false" placeholder="Dán key vào đây">

  <label for="server">Địa chỉ server</label>
  <input id="server" value="https://license-server-a70g.onrender.com">

  <button id="go">Kích hoạt</button>
  <div id="msg" role="status" aria-live="polite"></div>

  <div class="dev">Mã thiết bị: <span id="dev"></span></div>
</main>

<script>
  function getDeviceId() {
    try {
      let id = localStorage.getItem("device_id");
      if (!id) { id = crypto.randomUUID(); localStorage.setItem("device_id", id); }
      return id;
    } catch (e) { return "tam-" + Math.random().toString(36).slice(2); }
  }
  const deviceId = getDeviceId();
  document.getElementById("dev").textContent = deviceId;

  const msg = document.getElementById("msg");
  const btn = document.getElementById("go");

  function show(text, cls) { msg.textContent = text; msg.className = cls || ""; }

  btn.addEventListener("click", async () => {
    const key = document.getElementById("key").value.trim();
    const server = document.getElementById("server").value.trim().replace(/\/$/, "");
    if (!key) { show("Chưa nhập key.", "err"); return; }

    btn.disabled = true; show("Đang kiểm tra...");
    try {
      const res = await fetch(server + "/activate", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ key, device_id: deviceId })
      });
      const data = await res.json();
      if (res.ok && data.valid) {
        const d = new Date(data.expires_at * 1000).toLocaleDateString("vi-VN");
        show("Kích hoạt thành công. Hạn dùng đến " + d + ".", "ok");
      } else {
        show(data.detail || "Key không hợp lệ.", "err");
      }
    } catch (e) {
      show("Không kết nối được server. Kiểm tra server đã chạy và địa chỉ đã đúng chưa.", "err");
    } finally { btn.disabled = false; }
  });
</script>
</body>
</html>
