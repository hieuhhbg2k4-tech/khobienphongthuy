name: Cap nhat bien VPA len trang chu

# Mỗi ngày lấy dữ liệu từ Google Sheet BIENSOVP (Apps Script) → kho-data/web.json → web tự cập nhật.
# Có thể bấm "Run workflow" để cập nhật ngay.
on:
  schedule:
    - cron: "0 23 * * *"   # 06:00 giờ Việt Nam
    - cron: "0 11 * * *"   # 18:00 giờ Việt Nam
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: web-vpa
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Lay du lieu tu Google Sheet
        run: python tools/build_web_vpa.py kho-data/web.json

      - name: Luu du lieu
        run: |
          git config user.name "vpa-bot"
          git config user.email "vpa-bot@users.noreply.github.com"
          git add -A kho-data
          if git diff --cached --quiet; then echo "Khong co thay doi"; exit 0; fi
          git commit -m "Cap nhat bien VPA tu Google Sheet"
          git pull --rebase
          git push

      - name: Cap nhat trang web
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
