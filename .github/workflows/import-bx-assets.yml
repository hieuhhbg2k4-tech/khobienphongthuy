# Chạy 1 lần: tải ảnh giao diện từ bienxeoto.vn về assets/bx (chạy lại khi sửa tools/bx-assets.txt)
name: Tai anh giao dien bienxeoto
on:
  push:
    paths: ["tools/bx-assets.txt", "tools/import_bx_assets.py"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pillow==11.0.0
      - run: python tools/import_bx_assets.py
      - name: Luu anh
        run: |
          git config user.name "vpa-bot"; git config user.email "vpa-bot@users.noreply.github.com"
          git add assets/bx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Them anh giao dien tu bienxeoto.vn"
          for i in 1 2 3; do git pull --rebase origin "$GITHUB_REF_NAME" && git push && break; sleep 10; done
